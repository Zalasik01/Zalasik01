[phases.setup]
nixPkgs = ["nodejs_22", "python3"]

[phases.install]
cmds = [
  "cd frontend && npm install --include=dev",
  "cd backend && npm install --include=dev"
]

[phases.build]
cmds = [
  "cd frontend && npm run build",
  "cd backend && npx tsc"
]

[start]
cmd = "node backend/dist/db/seed.js; node backend/dist/index.js"
